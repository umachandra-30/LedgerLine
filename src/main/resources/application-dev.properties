# ===================================================================
# LedgerLine - Development Profile (application-dev.properties)
# ===================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}

# -------------------------------------------------------------------
# PostgreSQL Datasource Configuration
# Credentials are read from environment variables; sensible local defaults are provided.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledgerline_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2330}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# HikariCP Connection Pool (Default Spring Boot production pool)
# -------------------------------------------------------------------
spring.datasource.hikari.pool-name=LedgerLineHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# 'validate': Hibernate checks that database schema matches @Entity definitions.
# It will NOT alter or drop tables (schema changes belong exclusively to Flyway).
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Flyway Database Migration
# -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# -------------------------------------------------------------------
# Spring Boot Actuator Configuration
# Exposes health and info endpoints. 'always' reveals database status.
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

# -------------------------------------------------------------------
# Security & JWT Configuration
# In production, set JWT_SECRET via environment variable.
# Expiration default: 86400000 ms (24 hours).
# -------------------------------------------------------------------
ledgerline.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
ledgerline.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


